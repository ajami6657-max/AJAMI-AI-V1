name: AJAMI-AI MNN Vulkan A53 experiment

on:
  workflow_dispatch:
  push:
    branches: ['experiment/mnn-vulkan-a53']

permissions:
  contents: read

jobs:
  build-mnn-vulkan-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android NDK and CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Build MNN with Android Vulkan backend
        run: |
          git clone --depth 1 https://github.com/alibaba/MNN.git /tmp/MNN
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/MNN -B /tmp/MNN/build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_TOOLS=OFF \
            -DMNN_BUILD_DEMO=OFF \
            -DMNN_BUILD_CONVERTER=OFF \
            -DMNN_BUILD_LLM=OFF \
            -DMNN_BUILD_DIFFUSION=OFF \
            -DMNN_OPENCL=OFF \
            -DMNN_VULKAN=ON \
            -DMNN_VULKAN_IMAGE=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_USE_SYSTEM_LIB=OFF \
            -DMNN_USE_LOGCAT=ON \
            -DMNN_ARM82=ON
          cmake --build /tmp/MNN/build-android --target MNN -j2
          LIB="$(find /tmp/MNN/build-android -type f -name 'libMNN.so' | head -n 1)"
          test -n "$LIB"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp/third_party/MNN
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libMNN.so
          cp -a /tmp/MNN/include app/src/main/cpp/third_party/MNN/
          echo "Built MNN Vulkan library: $LIB"
          ls -lh app/src/main/jniLibs/arm64-v8a/libMNN.so
      - name: Compile embedded Vulkan compute shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          mkdir -p app/src/main/cpp/generated
          glslangValidator -V --target-env vulkan1.0 app/src/main/cpp/compute_smoke.comp -o /tmp/ajami_compute.spv
          python3 - <<'PY'
          import struct
          data = open('/tmp/ajami_compute.spv', 'rb').read()
          if len(data) % 4:
              raise SystemExit('SPIR-V byte count is not divisible by four')
          words = struct.unpack('<' + 'I' * (len(data) // 4), data)
          with open('app/src/main/cpp/generated/compute_shader_spv.h', 'w') as f:
              f.write('#pragma once\n#include <cstdint>\nalignas(4) static const uint32_t ajami_compute_spv[] = {\n')
              for i in range(0, len(words), 8):
                  f.write('    ' + ', '.join('0x%08xu' % x for x in words[i:i+8]) + ',\n')
              f.write('};\n')
          print('Embedded SPIR-V words:', len(words))
          PY
      - name: Build isolated diagnostic APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AJAMI-AI-MNN-Vulkan-A53-test
          path: app/build/outputs/apk/debug/app-debug.apk
