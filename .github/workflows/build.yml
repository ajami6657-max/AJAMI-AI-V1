name: Build AJAMI-AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/mobilei2v-offline-engine', 'feature/audio-i2v-next' ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

concurrency:
  group: ajami-ai-apk-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build offline image engine for Android ARM64
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.31.6"
          git clone --depth 1 --recurse-submodules https://github.com/leejet/stable-diffusion.cpp.git /tmp/stable-diffusion.cpp
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/stable-diffusion.cpp -B /tmp/stable-diffusion.cpp/build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DGGML_OPENMP=OFF \
            -DSD_OPENCL=OFF \
            -DSD_VULKAN=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/stable-diffusion.cpp/build-android --config Release --target sd-cli -j2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          BIN="$(find /tmp/stable-diffusion.cpp/build-android -type f -name sd-cli -perm -111 | head -n 1)"
          test -n "$BIN"
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libsd.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libsd.so
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AJAMI-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
