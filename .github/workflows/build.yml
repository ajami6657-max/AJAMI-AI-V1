name: Build AJAMI-AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/mobilei2v-offline-engine' ]

concurrency:
  group: ajami-ai-apk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build offline image engine for Android ARM64
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.31.6"
          git clone --depth 1 --recurse-submodules https://github.com/leejet/stable-diffusion.cpp.git /tmp/stable-diffusion.cpp
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/stable-diffusion.cpp -B /tmp/stable-diffusion.cpp/build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DGGML_OPENMP=OFF \
            -DSD_OPENCL=OFF \
            -DSD_VULKAN=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/stable-diffusion.cpp/build-android --config Release --target sd-cli -j2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          BIN="$(find /tmp/stable-diffusion.cpp/build-android -type f -name sd-cli -perm -111 | head -n 1)"
          test -n "$BIN"
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libsd.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libsd.so
      - name: Compile embedded Vulkan compute shader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          mkdir -p app/src/main/cpp/generated
          glslangValidator -V --target-env vulkan1.0 app/src/main/cpp/compute_smoke.comp -o /tmp/ajami_compute.spv
          python3 - <<'PY'
          import struct
          data = open('/tmp/ajami_compute.spv', 'rb').read()
          if len(data) % 4:
              raise SystemExit('SPIR-V byte count is not divisible by four')
          words = struct.unpack('<' + 'I' * (len(data) // 4), data)
          with open('app/src/main/cpp/generated/compute_shader_spv.h', 'w') as f:
              f.write('#pragma once\\n#include <cstdint>\\nalignas(4) static const uint32_t ajami_compute_spv[] = {\\n')
              for i in range(0, len(words), 8):
                  f.write('    ' + ', '.join('0x%08xu' % x for x in words[i:i+8]) + ',\\n')
              f.write('};\\n')
          print('Embedded SPIR-V words:', len(words))
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AJAMI-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
